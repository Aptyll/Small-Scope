<!doctype html>
<meta charset="utf-8">
<title>Concept sheet - THING, round N</title>
<style>
  body { margin: 0; background: #cdd8e8; font: 14px/1.4 system-ui, sans-serif; color: #101830; }
  canvas { display: block; image-rendering: pixelated; }
</style>
<canvas id="c"></canvas>
<script>
// CONCEPT SHEET TEMPLATE (the `concept-art` skill). Copy to docs/media/concepts/<thing>-concepts-<round>.html.
// Say here what was asked, and - once decided - which letter was picked or why all were rejected.
//
// Grids: one string per pixel row, 16 chars wide, `.` = transparent. rows 0..H-2 are the body,
// the boots row is appended per pose from `feet`. Letters are the game's (js/sprites.js PPAL):
//   o outline  k/K skin  e eye  b boots  y/Y THE team colour (coat / coatL) - keep it to ONE piece.
// Add your own letters per candidate in its `pal`. Front (`down`) and back (`up`) must be
// mirror-symmetric; `side` faces RIGHT and is flipped for left.
const TEAMS = [
  { name: 'RED',  coat: '#c9524e', coatL: '#df7358', coatD: '#96393f' },
  { name: 'BLUE', coat: '#3f6fb0', coatL: '#5e93d8', coatD: '#2b4d7d' },
];
const BASE = { o: '#2e2440', k: '#f2c69b', K: '#d69f72', e: '#2e2440', b: '#4a3324', h: '#3a2a1e' };
const feet = { front: '.....bb..bb.....', side: '.....bb.bb......' };

// ---- A: TWO-WORD NAME --------------------------------------------------------
const A = {
  label: 'A  TWO-WORD NAME',
  pal: (t) => ({ ...BASE, y: t.coat, Y: t.coatL, r: '#6a5a48', R: '#857460', d: '#473a2d' }),
  down: [
    '................',
    '.....oyyyyo.....',
    '....oyyYYyyo....',
    '....okkkkkko....',
    '....okekkeko....',
    '....okkKKkko....',
    '...orrrrrrrro...',
    '...orrrrrrrro...',
    '...orRrrrrRro...',
    '...orrrrrrrro...',
    '...orrrrrrrro...',
    '...orrrrrrrro...',
    '...orrrrrrrro...',
    '...oddddddddo...',
  ],
  up: [
    '................',
    '.....oyyyyo.....',
    '....oyyyyyyo....',
    '....ohhhhhho....',
    '....ohhhhhho....',
    '....okkkkkko....',
    '...orrrrrrrro...',
    '...orrrrrrrro...',
    '...orRrrrrRro...',
    '...orrrrrrrro...',
    '...orrrrrrrro...',
    '...orrrrrrrro...',
    '...orrrrrrrro...',
    '...oddddddddo...',
  ],
  side: [
    '................',
    '....oyyyyo......',
    '....oyyYyyo.....',
    '....ohhkkkko....',
    '....ohhkkeko....',
    '....ohhkKkko....',
    '...orrrrrrro....',
    '...orrrrrrro....',
    '...orRrrrrro....',
    '...orrrrrrro....',
    '...orrrrrrro....',
    '...orrrrrrro....',
    '...orrrrrrro....',
    '...odddddddo....',
  ],
};
// ---- B, C: copy A and change the SHAPE, not just the palette -----------------

// the reference slot beside every candidate: the RED/BLUE player body (front), so the scale reads
const PLAYER = {
  pal: (t) => ({ ...BASE, t: '#3e8c81', T: '#58ab98', m: '#f6ecd4', M: '#d9c5a0', x: '#e8967f', r: t.coat, R: t.coatL, d: t.coatD, p: '#463c5c', b: '#6f4d38' }),
  down: [
    '................',
    '.......mm.......',
    '.......mM.......',
    '.....otttto.....',
    '....otTTTTto....',
    '....otttttto....',
    '....okkkkkko....',
    '....okekkeko....',
    '....oxkKKkxo....',
    '....ommmmmmo....',
    '...orrrRRrrro...',
    '...orrrRRrrro...',
    '...omorrrromo...',
    '....oddddddo....',
    '.....pp..pp.....',
    '.....bb..bb.....',
  ],
};

// ---- the sheet itself: nothing below needs editing -----------------------------
const variants = [A];            // add B, C
const S = 6, PAD = 24;           // px per pixel, margin
const H = variants[0].down.length + 1; // body rows + the boots row
const cv = document.getElementById('c');
cv.width = PAD * 2 + variants.length * (16 * S * 5 + 8 * 4 + 40);
cv.height = PAD * 2 + 2 * ((H + 2) * S + 40) + 12;
const g = cv.getContext('2d');
g.fillStyle = '#cdd8e8'; g.fillRect(0, 0, cv.width, cv.height);
function draw(rows, pal, x, y) {
  for (let r = 0; r < rows.length; r++) for (let c = 0; c < rows[r].length; c++) {
    const col = pal[rows[r][c]]; if (!col) continue;
    g.fillStyle = col; g.fillRect(x + c * S, y + r * S, S, S);
  }
}
const check = (rows, name) => {
  if (rows.length !== H - 1) throw new Error(name + ' rows ' + rows.length + ' (expected ' + (H - 1) + ')');
  rows.forEach((r, i) => { if (r.length !== 16) throw new Error(name + ' row ' + i + ' width ' + r.length); });
};
let vx = PAD;
for (const V of variants) {
  check(V.down, V.label); check(V.up, V.label); check(V.side, V.label);
  g.fillStyle = '#101830'; g.font = 'bold 18px system-ui, sans-serif';
  g.fillText(V.label, vx, PAD - 4);
  TEAMS.forEach((t, ti) => {
    const y = PAD + 12 + ti * ((H + 2) * S + 40);
    const pal = V.pal(t);
    const flip = (rows) => rows.map((r) => r.split('').reverse().join(''));
    const poses = [[V.down, 'front'], [V.side, 'side'], [flip(V.side), 'side'], [V.up, 'front']];
    let x = vx;
    for (const [rows, ft] of poses) {
      draw(rows.concat([feet[ft]]), pal, x, y);
      x += 16 * S + 8;
    }
    draw(PLAYER.down, PLAYER.pal(t), x + 8, y + (H - 16) * S);
    g.fillStyle = '#101830'; g.font = '12px system-ui, sans-serif';
    g.fillText(t.name + ' side  (player beside for scale)', vx, y + H * S + 22);
  });
  vx += 16 * S * 5 + 8 * 4 + 40;
}
// the dev server's screenshot sink (app/server.js): the sheet lands in shot.png at the repo root
fetch('/shot', { method: 'POST', body: cv.toDataURL('image/png') }).catch(() => {});
</script>
