<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Softfall</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #000; /* pillarbox bars on wider-than-16:9 screens */
    overflow: hidden;
  }
  body { display: flex; align-items: center; justify-content: center; }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  #game { position: relative; z-index: 1; background: #0d1524; }
  /* the replay window's frame, at device resolution over the game canvas's
     bottom-left corner: the game canvas has too few pixels there to hold it */
  #replay { position: fixed; z-index: 2; display: none; pointer-events: none; }
  /* decorative frost frame behind the game; visible only as pillarbox bars */
  #bars { position: fixed; top: 0; left: 0; z-index: 0; pointer-events: none; }
</style>
</head>
<body>
<canvas id="bars"></canvas>
<canvas id="game" width="480" height="270"></canvas>
<canvas id="replay"></canvas>
<script src="js/font.js"></script>
<script src="js/sprites.js"></script>
<!-- audio/sfx/*.mp3 baked to base64 by tools/bake-sfx.js: a file:// page cannot fetch
     its own folder, so this is what lets the sound effects work when index.html
     is opened straight off the disk. Must load before audio.js. -->
<script src="js/sfxdata.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
</body>
</html>
