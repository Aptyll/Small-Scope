<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Emberfrost</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #000; /* pillarbox bars on wider-than-16:9 screens */
    overflow: hidden;
  }
  body { display: flex; align-items: center; justify-content: center; }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  #game { position: relative; z-index: 1; background: #0d1524; }
  /* decorative frost frame behind the game; visible only as pillarbox bars */
  #bars { position: fixed; top: 0; left: 0; z-index: 0; pointer-events: none; }
</style>
</head>
<body>
<canvas id="bars"></canvas>
<canvas id="game" width="480" height="270"></canvas>
<script src="js/font.js"></script>
<script src="js/sprites.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
</body>
</html>
