<!doctype html>
<meta charset="utf-8">
<title>Concept scene - the fish hold at dusk, round 1</title>
<style>
  body { margin: 0; background: #101830; }
  canvas { display: block; image-rendering: pixelated; }
</style>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// CONCEPT SCENE (the `concept-art` skill): the game's own dusk frame at seed 42 with a fish net on
// a carved hole, captured with the hero warped off-screen (fish-scene-bg.png, POST /shot?f=), and
// the HOLD frame from fish-catch-concepts-1.html painted back at the hero's spot at the frame's
// device scale. ?v=A|B|C picks the hold; the sheet's decision is what ships.
// Decision: A shipped in PATCH 2.67 (see fish-catch-concepts-1.html); this page stays as the dusk-scene mock-up.
const q = new URLSearchParams(location.search), V = q.get('v') || 'A';
const TEAM = { coat: '#3f6fb0', coatL: '#5e93d8', coatD: '#2b4d7d' }; // BLUE - the hero's own side
const pal = {
  o: '#2e2440', t: '#3e8c81', T: '#58ab98', m: '#f6ecd4', M: '#d9c5a0', k: '#f2c69b', K: '#d69f72',
  e: '#2e2440', x: '#e8967f', r: TEAM.coat, R: TEAM.coatL, d: TEAM.coatD, p: '#463c5c', b: '#6f4d38',
  n: '#243b52', f: '#4f7ea3', F: '#6f9fc0', w: '#c9dded', i: '#101d2c', c: '#9fd6f2',
};
const IDLE10 = [
  '................', '.......mm.......', '.......mM.......', '.....otttto.....', '....otTTTTto....',
  '....otttttto....', '....okkkkkko....', '....okekkeko....', '....oxkKKkxo....', '....ommmmmmo....',
];
const HOLD = {
  A: [
    '.......nnnn.....', '..n..nFFFFFn....', '..nnnFfFFiFFn...', '..n..nFwwFFn....', '..mm...nnnn.mm..',
    '..or...mm...ro..', '..or...mM...ro..', '..or.otttto.ro..', '..orotTTTTtoro..', '..orottttttoro..',
    '..orokkkkkkoro..', '..orokekkekoro..', '..oroxkKKkxoro..', '..orommmmmmoro..', '..orrrrRRrrrro..',
    '...orrrRRrrro...', '...orrrrrrrro...', '....oddddddo....', '.....pp..pp.....', '.....bb..bb.....',
  ],
  B: IDLE10.concat([
    '..orRnnnnnnRro..', '..onnFFfFFiFnro.', '..omnFwwFFFnmo..', '....onnnnnno....', '.....pp..pp.....', '.....bb..bb.....',
  ]),
  C: [
    '................', '.......mm.......', '.......mM.......', '..mm.otttto.....', '.nn.otTTTTto....',
    'nFFnotttttto....', 'nFfFokkkkkko....', 'nFfFokekkeko....', 'nFwFoxkKKkxo....', 'nFwFommmmmmo....',
    'nFwnrrrRRrrro...', 'nFfnrrrRRrrro...', 'niFnrrrrrromo...', '.nn.oddddddo....', '.....pp..pp.....', '.....bb..bb.....',
  ],
};
// where drawPlayer put the hero in the capture: view-space (sx, sy) is the player's x/y, the
// 16x16 cell's top-left is (sx - 8, sy - 12), device scale 4 - a taller hold frame keeps its feet
const SX = 240, SY = 135, DEV = 4;
const cv = document.getElementById('c'), g = cv.getContext('2d');
g.imageSmoothingEnabled = false;
const img = new Image();
img.onload = () => {
  g.drawImage(img, 0, 0);
  const rows = HOLD[V], y0 = SY - 12 + 16 - rows.length, x0 = SX - 8;
  // the drop shadow drawPlayer paints under a standing body
  g.fillStyle = 'rgba(110,130,170,0.4)';
  g.fillRect((SX - 5) * DEV, (SY + 2) * DEV, 10 * DEV, 2 * DEV);
  for (let r = 0; r < rows.length; r++) for (let c = 0; c < 16; c++) {
    const col = pal[rows[r][c]]; if (!col) continue;
    g.fillStyle = col; g.fillRect((x0 + c) * DEV, (y0 + r) * DEV, DEV, DEV);
  }
  fetch('/shot?f=docs/media/concepts/fish-hold-scene-1' + (V === 'A' ? '' : '-' + V) + '.png', { method: 'POST', body: cv.toDataURL('image/png') }).catch(() => {});
};
img.src = 'fish-scene-bg.png';
</script>
