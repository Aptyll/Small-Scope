<!doctype html>
<meta charset="utf-8">
<title>Concept sheet - fish catch animation, round 1</title>
<style>
  body { margin: 0; background: #cdd8e8; font: 14px/1.4 system-ui, sans-serif; color: #101830; }
  canvas { display: block; image-rendering: pixelated; }
</style>
<canvas id="c"></canvas>
<script>
// CONCEPT SHEET - the player catching a fish and holding it up (the `concept-art` skill).
// Asked 2026-09-02: an animation for the catch (spearFish / a net take, js/tools.js) that ends
// on the player holding the fish, then a dusk scene mock-up with it (fish-hold-scene-1.html).
// The catch is shared: IDLE -> STOOP (bends to the hole) -> HAUL (fish out at the chest, drops
// flying) -> HOLD, and the HOLD is what differs. All frames face DOWN: the proposal is that the
// catch always turns the player to the camera for the hoist, so one facing is the whole set.
// A is 16x20 (four rows above the hat for the fish); B and C fit the 16x16 cell.
// Decision: A (TROPHY HOIST) picked 2026-09-02 and shipped in PATCH 2.67 - catchStoop / catchHaul /
// catchHold and the skater's skCatch* grids in js/sprites.js, played by startCatch (js/tools.js).
const TEAMS = [
  { name: 'RED',  coat: '#c9524e', coatL: '#df7358', coatD: '#96393f' },
  { name: 'BLUE', coat: '#3f6fb0', coatL: '#5e93d8', coatD: '#2b4d7d' },
];
// PPAL (js/sprites.js) with the coat swapped per team, plus the fish letters off FIPAL:
// n fish outline, f fish dark, F fish light, w belly, i fish eye, c water drop.
const pal = (t) => ({
  o: '#2e2440', t: '#3e8c81', T: '#58ab98', m: '#f6ecd4', M: '#d9c5a0', k: '#f2c69b', K: '#d69f72',
  e: '#2e2440', x: '#e8967f', r: t.coat, R: t.coatL, d: t.coatD, p: '#463c5c', b: '#6f4d38',
  n: '#243b52', f: '#4f7ea3', F: '#6f9fc0', w: '#c9dded', i: '#101d2c', c: '#9fd6f2',
});
const IDLE = [
  '................',
  '.......mm.......',
  '.......mM.......',
  '.....otttto.....',
  '....otTTTTto....',
  '....otttttto....',
  '....okkkkkko....',
  '....okekkeko....',
  '....oxkKKkxo....',
  '....ommmmmmo....',
  '...orrrRRrrro...',
  '...orrrRRrrro...',
  '...omorrrromo...',
  '....oddddddo....',
  '.....pp..pp.....',
  '.....bb..bb.....',
];
// bends to the hole: head two rows down, knees gone, mittens reaching past the hem
const STOOP = [
  '................',
  '................',
  '................',
  '.......mm.......',
  '.......mM.......',
  '.....otttto.....',
  '....otTTTTto....',
  '....otttttto....',
  '....okkkkkko....',
  '....okekkeko....',
  '....oxkKKkxo....',
  '....ommmmmmo....',
  '...orrrRRrrro...',
  '..morrrRRrrrom..',
  '....oddddddo....',
  '.....bb..bb.....',
];
// the fish comes up in front of the chest, tail first, water flying off it
const HAUL = [
  '................',
  '.......mm.......',
  '.......mM.......',
  '.....otttto.....',
  '....otTTTTto....',
  '....otttttto....',
  '....okkkkkko....',
  '....okekkeko....',
  '....oxkKKkxo....',
  '..c.ommnnmmo.c..',
  '...orrnFFnrro...',
  '..c.omnFfFnmo.c.',
  '...orrnFwFnro...',
  '....odnFiFndo...',
  '.....pnnnnpp....',
  '.....bb..bb.....',
];
// ---- A: TROPHY HOIST - both arms straight up, the fish held flat above the hat (16x20)
const A = {
  label: 'A  TROPHY HOIST',
  hold: [
    '.......nnnn.....',
    '..n..nFFFFFn....',
    '..nnnFfFFiFFn...',
    '..n..nFwwFFn....',
    '..mm...nnnn.mm..',
    '..or...mm...ro..',
    '..or...mM...ro..',
    '..or.otttto.ro..',
    '..orotTTTTtoro..',
    '..orottttttoro..',
    '..orokkkkkkoro..',
    '..orokekkekoro..',
    '..oroxkKKkxoro..',
    '..orommmmmmoro..',
    '..orrrrRRrrrro..',
    '...orrrRRrrro...',
    '...orrrrrrrro...',
    '....oddddddo....',
    '.....pp..pp.....',
    '.....bb..bb.....',
  ],
};
// ---- B: CHEST HUG - the fish cradled flat across the coat, mittens under both ends (16x16)
const B = {
  label: 'B  CHEST HUG',
  hold: IDLE.slice(0, 10).concat([
    '..orRnnnnnnRro..',
    '..onnFFfFFiFnro.',
    '..omnFwwFFFnmo..',
    '....onnnnnno....',
    '.....pp..pp.....',
    '.....bb..bb.....',
  ]),
};
// ---- C: BIG CATCH - a fish as tall as the body, held by the tail at the side, head down (16x16)
const C = {
  label: 'C  BIG CATCH',
  hold: [
    '................',
    '.......mm.......',
    '.......mM.......',
    '..mm.otttto.....',
    '.nn.otTTTTto....',
    'nFFnotttttto....',
    'nFfFokkkkkko....',
    'nFfFokekkeko....',
    'nFwFoxkKKkxo....',
    'nFwFommmmmmo....',
    'nFwnrrrRRrrro...',
    'nFfnrrrRRrrro...',
    'niFnrrrrrromo...',
    '.nn.oddddddo....',
    '.....pp..pp.....',
    '.....bb..bb.....',
  ],
};

// ---- the sheet: per candidate, RED and BLUE rows of IDLE -> STOOP -> HAUL -> HOLD, feet aligned
const variants = [A, B, C];
const S = 6, PAD = 24, GAP = 10, CELL = 16 * S + GAP, ROW_H = 20 * S + 44;
const cv = document.getElementById('c');
cv.width = PAD * 2 + variants.length * (CELL * 4 + 36);
cv.height = PAD + 20 + 2 * ROW_H + 8;
const g = cv.getContext('2d');
g.fillStyle = '#cdd8e8'; g.fillRect(0, 0, cv.width, cv.height);
const check = (rows, name) => rows.forEach((r, i) => { if (r.length !== 16) throw new Error(name + ' row ' + i + ' width ' + r.length); });
function draw(rows, p, x, yFeet) {
  const y0 = yFeet - rows.length * S;
  for (let r = 0; r < rows.length; r++) for (let c = 0; c < rows[r].length; c++) {
    const col = p[rows[r][c]]; if (!col) continue;
    g.fillStyle = col; g.fillRect(x + c * S, y0 + r * S, S, S);
  }
}
check(IDLE, 'IDLE'); check(STOOP, 'STOOP'); check(HAUL, 'HAUL');
let vx = PAD;
for (const V of variants) {
  check(V.hold, V.label);
  g.fillStyle = '#101830'; g.font = 'bold 18px system-ui, sans-serif';
  g.fillText(V.label, vx, PAD - 4);
  TEAMS.forEach((t, ti) => {
    const yFeet = PAD + 20 + ti * ROW_H + 20 * S;
    const p = pal(t);
    [IDLE, STOOP, HAUL, V.hold].forEach((rows, i) => draw(rows, p, vx + i * CELL, yFeet));
    g.fillStyle = '#101830'; g.font = '12px system-ui, sans-serif';
    ['idle', 'stoop', 'haul', 'hold'].forEach((n, i) => g.fillText(n, vx + i * CELL, yFeet + 16));
    g.fillText(t.name, vx + 4 * CELL - 4, yFeet + 32);
  });
  vx += CELL * 4 + 36;
}
fetch('/shot?f=docs/media/concepts/fish-catch-concepts-1.png', { method: 'POST', body: cv.toDataURL('image/png') }).catch(() => {});
</script>
